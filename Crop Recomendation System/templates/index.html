<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation AI</title>

    <style>
        body {
            background-color: #f0fff4;
            font-family: Arial;
        }
        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-top: 60px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2f855a;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2f855a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover {
            background: #276749;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e6fffa;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="container">
        <h1>🌾 Crop Recommendation</h1>

        <form method="POST" action="/predict">

            <input type="number" name="N" placeholder="Nitrogen (N)" required>
            <input type="number" name="P" placeholder="Phosphorus (P)" required>
            <input type="number" name="K" placeholder="Potassium (K)" required>

            <input type="number" step="0.1" name="temperature" placeholder="Temperature (°C)" required>
            <input type="number" step="0.1" name="humidity" placeholder="Humidity (%)" required>
            <input type="number" step="0.1" name="ph" placeholder="pH Level" required>
            <input type="number" step="0.1" name="rainfall" placeholder="Rainfall (mm)" required>

            <button type="submit">Predict Crop</button>
        </form>

        {% if crop %}
        <div class="result">
            🤖 <b>Recommended Crop:</b> {{ crop }}
        </div>
        {% endif %}
    </div>

</body>
</html>
